<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>星球演化</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <h1 id="planetName">星球演化</h1>
    <div class="year">年份 <span id="year">-</span></div>
  </header>

  <p id="error" class="error" hidden></p>

  <section class="panel">
    <h2>世界地图</h2>
    <svg id="worldMap" viewBox="0 0 1000 500" style="width:100%;height:auto;"></svg>
  </section>

  <section class="panel">
    <h2>世界状态</h2>
    <dl class="stats">
      <dt>总人口</dt><dd id="population">-</dd>
      <dt>总科技</dt><dd id="techTotal">-</dd>
      <dt>食物</dt><dd id="food">-</dd>
      <dt>资源</dt><dd id="resources">-</dd>
      <dt>温度</dt><dd id="temperature">-</dd>
      <dt>宜居度</dt><dd id="habitability">-</dd>
      <dt>时代</dt><dd id="era">-</dd>
      <dt>时间状态</dt><dd id="clock">-</dd>
    </dl>
  </section>

  <section class="panel">
    <h2>时间控制</h2>
    <div class="controls">
      <label>推进年数
        <input id="years" type="number" min="1" max="10000" value="10">
      </label>
      <button id="advance">推进</button>
      <button id="runToMajor">大事模式：跑到下一个重大事件</button>
    </div>
    <div class="controls">
      <button id="pause">暂停</button>
      <button id="resume">恢复</button>
      <label>速度 1~100
        <input id="speed" type="number" min="1" max="100" value="1">
      </label>
      <button id="setSpeed">设置速度</button>
      <button id="saveWorld">保存世界</button>
    </div>
    <p class="note">说明：暂停 / 恢复 / 速度目前仅设置后端状态，后端尚未实现按倍率自动推进；推进请使用上方按钮。</p>
  </section>

  <section class="panel">
    <h2>玩家指挥</h2>
    <div class="controls">
      <label>用一句话下达指令
        <input id="commandText" type="text" size="40" placeholder="例如：攻打南亚 / 发展科技 / 扩张">
      </label>
      <button id="sendCommand">发送</button>
    </div>
    <p id="commandResult" class="note">支持：attack（攻打区域）、develop_tech（发展科技）、expand（扩张）。</p>
  </section>

  <section class="panel">
    <h2>历史事件 <span id="eventCount" class="badge"></span></h2>
    <p class="note">高亮为重大事件（稀有度 ≥ 60）。</p>
    <ul id="events"></ul>
  </section>

  <section class="panel">
    <h2>文明列表 <span id="civCount" class="badge"></span></h2>
    <table id="civilizations">
      <thead>
        <tr><th>名称</th><th>诞生年</th><th>人口</th><th>科技</th><th>状态</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <script src="/app.js"></script>
</body>
</html>
